[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heat-exposure-router"
version = "0.1.0"
description = "نظام ذكي للتنبؤ بالتعرض الحراري وتحسين المسارات الخارجية"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Fadi Alharbi", email = "fadialhrby0@gmail.com"},
]
keywords = ["heat-exposure", "route-optimization", "thermal-comfort", "GIS", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core data processing
    "numpy>=1.24",
    "pandas>=2.0",

    # GIS & Mapping
    "osmnx>=1.9",
    "networkx>=3.1",
    "geopandas>=0.14",
    "shapely>=2.0",
    "folium>=0.15",
    "branca>=0.7",

    # Weather data
    "requests>=2.31",
    "requests-cache>=1.1",

    # Solar geometry
    "pvlib>=0.10",

    # Machine Learning
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "joblib>=1.3",

    # Explainability
    "shap>=0.43",

    # API
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",

    # UI
    "streamlit>=1.29",
    "plotly>=5.18",

    # Utilities
    "python-dotenv>=1.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "httpx>=0.25",
    "ruff>=0.1",
]
timeseries = [
    "prophet>=1.1",
    "statsmodels>=0.14",
]
raster = [
    "xarray>=2023.10",
    "rasterio>=1.3",
    "netCDF4>=1.6",
]

[project.urls]
Homepage = "https://github.com/Fadi-Alharbi/Heat-Exposure-Prediction-Route-Optimization-System-Architecture"
Repository = "https://github.com/Fadi-Alharbi/Heat-Exposure-Prediction-Route-Optimization-System-Architecture"
Issues = "https://github.com/Fadi-Alharbi/Heat-Exposure-Prediction-Route-Optimization-System-Architecture/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
